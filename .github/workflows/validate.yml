name: Validate project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/catalog.py check
      - run: python tools/drafts.py check
      - run: python tools/contributions.py check
      - run: python tools/glossary.py check
      - run: python -m unittest discover -s tests -v
      - run: python tools/catalog.py build
      - run: python -m compileall -q tools components/local-translator
